name: Build 3CX Docker image

# Anti-suprapunere: o singura rulare a build-ului in acelasi timp
concurrency:
  group: build-3cx
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publica release (debifeaza pentru test only)'
        default: true
        required: true
        type: boolean
      debian_version:
        description: 'Versiune Debian a repo-ului 3CX (ex: bookworm)'
        default: 'bookworm'
        required: true
        type: string

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: write
    steps:
      - name: Set build number
        # Default la 1 daca variabila de repo BUILD_NUMBER nu e setata
        run: echo "BUILD_NUMBER=${{ vars.BUILD_NUMBER || '1' }}" >> "$GITHUB_ENV"

      - name: Get package version
        # Determina ultima versiune 3cxpbx direct din repo-ul oficial (Packages.gz).
        # Fara htmlq/changelog (era cod mort care strica build-ul).
        run: |
          set -uo pipefail
          url="http://repo.3cx.com/3cx/dists/${{ github.event.inputs.debian_version }}/main/binary-amd64/Packages.gz"
          package_version=$(curl -fsSL "$url" | gunzip \
            | awk '/^Package: 3cxpbx$/{f=1} f&&/^Version: /{print $2; f=0}' \
            | sort -rV | head -1)
          if [ -z "$package_version" ]; then
            echo "::error::Nu am putut determina versiunea 3cxpbx din $url"
            exit 1
          fi
          major_version=${package_version%%.*}
          echo "Versiune detectata: $package_version (major $major_version)"
          echo "package_version=$package_version" >> "$GITHUB_ENV"
          echo "major_version=$major_version" >> "$GITHUB_ENV"
        shell: bash

      - name: Checkout
        uses: actions/checkout@v5.0.1

      - name: Login to DockerHub
        if: github.event.inputs.release == 'true'
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        if: github.event.inputs.release == 'true'
        # PAT (GHCR_TOKEN) cu write:packages: detine pachetul ghcr.io/levinetit/3cx
        # (preexistent) -> permite push. GITHUB_TOKEN da login OK dar push denied
        # pe pachet preexistent nelegat de repo.
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build stage1 image
        run: |
          docker build \
            --force-rm \
            --no-cache \
            --build-arg PACKAGE_VERSION=${{ env.package_version }} \
            --build-arg DEBIAN_VERSION=${{ github.event.inputs.debian_version }} \
            --build-arg BUILD_STRING="$(date -u)" \
            --build-arg BUILD_DATE="$(date +%d-%m-%Y)" \
            --build-arg BUILD_TIME="$(date +%H:%M:%S)" \
            -t 3cx_stage1 .

      - name: Install 3cxpbx in running container (stage2)
        run: |
          set -uo pipefail
          # Pornire container cu systemd
          docker run -d --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            --name 3cx_stage1_c 3cx_stage1

          # Asteapta systemd sa fie gata (max ~200s)
          echo "Astept systemd..."
          ready=no
          for i in $(seq 1 40); do
            status=$(docker exec 3cx_stage1_c systemctl is-system-running 2>/dev/null || true)
            echo "[$i] $status"
            if echo "$status" | grep -qE "running|degraded"; then ready=yes; break; fi
            sleep 5
          done
          if [ "$ready" != yes ]; then
            echo "::error::systemd nu a pornit in container in timpul alocat"
            docker exec 3cx_stage1_c systemctl --failed 2>/dev/null || true
            docker logs 3cx_stage1_c 2>&1 | tail -50 || true
            exit 1
          fi

          # Instaleaza 3cxpbx si activeaza serviciile
          docker exec 3cx_stage1_c bash -c "
            systemctl mask systemd-logind console-getty.service container-getty@.service \
              getty-static.service getty@.service serial-getty@.service getty.target \
            && apt-get update \
            && echo 1 | apt-get -y install 3cxpbx=${{ env.package_version }} \
            && systemctl enable nginx postgresql 3cx_fix_perms.service 3cx_autosetup.service \
            && (systemctl enable exim4 2>/dev/null || true)
          "

          # Verifica ca 3cxpbx chiar s-a instalat inainte de commit
          if ! docker exec 3cx_stage1_c dpkg -l 3cxpbx 2>/dev/null | grep -q '^ii'; then
            echo "::error::3cxpbx nu s-a instalat corect in container"
            docker logs 3cx_stage1_c 2>&1 | tail -50 || true
            exit 1
          fi

          docker stop 3cx_stage1_c

      - name: Commit and tag image
        run: |
          IMAGE_TAG="v${{ env.major_version }}.${{ env.BUILD_NUMBER }}"

          docker commit 3cx_stage1_c ${{ secrets.DOCKER_USER }}/3cx:${IMAGE_TAG}
          docker tag ${{ secrets.DOCKER_USER }}/3cx:${IMAGE_TAG} ${{ secrets.DOCKER_USER }}/3cx:latest
          docker tag ${{ secrets.DOCKER_USER }}/3cx:${IMAGE_TAG} ghcr.io/levinetit/3cx:${IMAGE_TAG}
          docker tag ${{ secrets.DOCKER_USER }}/3cx:${IMAGE_TAG} ghcr.io/levinetit/3cx:latest
          docker tag ${{ secrets.DOCKER_USER }}/3cx:${IMAGE_TAG} ghcr.io/levinetit/3cx:${{ env.BUILD_NUMBER }}

          docker rm 3cx_stage1_c
          docker rmi 3cx_stage1

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Push images (release only)
        if: github.event.inputs.release == 'true'
        run: |
          docker push ${{ secrets.DOCKER_USER }}/3cx:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.DOCKER_USER }}/3cx:latest
          docker push ghcr.io/levinetit/3cx:${{ env.IMAGE_TAG }}
          docker push ghcr.io/levinetit/3cx:latest
          docker push ghcr.io/levinetit/3cx:${{ env.BUILD_NUMBER }}

      - name: Increment build number
        if: github.event.inputs.release == 'true'
        env:
          BUILD_NUMBER: ${{ vars.BUILD_NUMBER || '1' }}
        run: |
          next=$(( BUILD_NUMBER + 1 ))
          code=$(curl -s -o /tmp/var_resp.json -w "%{http_code}" -X PATCH \
            -H "Authorization: token ${{ secrets.GHCR_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/variables/BUILD_NUMBER" \
            -d "{\"name\":\"BUILD_NUMBER\",\"value\":\"$next\"}")
          echo "PATCH BUILD_NUMBER -> HTTP $code (next=$next)"
          if [ "$code" != "204" ]; then
            cat /tmp/var_resp.json || true
            echo "::warning::Nu am putut incrementa BUILD_NUMBER (GHCR_TOKEN are nevoie de scope 'Variables: read & write')"
          fi

      - name: Create Release
        if: github.event.inputs.release == 'true'
        # github.token (are contents:write) creeaza release + tag. Posibil dupa ce
        # ruleset-ul "tag create protections" (1738010) a fost relaxat: regula
        # 'creation' eliminata, ramane doar 'update' -> tag-uri noi v* permise.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Imagine 3CX Docker:
          > docker run levinetit/3cx:${{ env.IMAGE_TAG }}

          Versiune 3cxpbx: ${{ env.package_version }}
          Changelog: https://www.3cx.com/blog/change-log/phone-system-change-log/"

          # Sare doar daca release-ul exista deja; orice alta eroare ESUEAZA pasul
          if gh release view "${{ env.IMAGE_TAG }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ env.IMAGE_TAG }} exista deja, sar peste."
          else
            gh release create "${{ env.IMAGE_TAG }}" \
              --repo "${{ github.repository }}" \
              --title "Release ${{ env.IMAGE_TAG }}" \
              --notes "$NOTES"
          fi
